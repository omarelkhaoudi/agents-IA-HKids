services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hkids_admin_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hkids_admin_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hkids_admin_ai
      JWT_SECRET: dev-compose-jwt-secret-change-me
      DEFAULT_PROVIDER: anthropic
      DEFAULT_MODEL: claude-3-5-sonnet-latest
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
